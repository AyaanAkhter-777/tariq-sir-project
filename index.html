<style>
:root{
  --bg:#f3f5fa;--card:#fff;--ink:#16223b;--mute:#5d6a86;--line:#e2e7f1;
  --brand:#1b365d;--brand-dark:#0f2342;--acc:#2a62d9;--accfg:#fff;
  --gold:#f59e0b;--ok:#0f7a55;--okbg:#dff5ec;--warn:#8a5a00;--warnbg:#fdf0cf;
  --bad:#b42318;--badbg:#fde4e1;
  box-sizing:border-box;
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0b1120;--card:#151e32;--ink:#e8edf8;--mute:#9aa7c4;--line:#222f49;
    --brand:#0f2342;--acc:#5b8eff;--accfg:#0b1220;--ok:#5fd6a6;--okbg:#10362b;
    --warn:#f2c15a;--warnbg:#3a2d0e;--bad:#ff9a8f;--badbg:#401a17;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1120;--card:#151e32;--ink:#e8edf8;--mute:#9aa7c4;--line:#222f49;
  --brand:#0f2342;--acc:#5b8eff;--accfg:#0b1220;--ok:#5fd6a6;--okbg:#10362b;
  --warn:#f2c15a;--warnbg:#3a2d0e;--bad:#ff9a8f;--badbg:#401a17;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:500 15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  padding-bottom:calc(80px + env(safe-area-inset-bottom,0px));
}
.wrap{max-width:1100px;margin:0 auto;padding:0 14px}

/* High-Contrast Hero Header featuring input logo brand styling */
.hero{
  background:linear-gradient(135deg,#0d1a31 0%,#1b365d 65%,#264575 100%);
  color:#fff;padding:calc(20px + env(safe-area-inset-top,0px)) 0 54px;
  box-shadow:0 10px 32px -8px rgba(15,35,66,0.65);position:relative;
}
.hero-content{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand-box{display:flex;align-items:center;gap:18px}
.brand-logo-container{
  width:64px;height:64px;border-radius:12px;background:#fff;padding:1.5px;
  box-shadow:0 10px 22px rgba(0,0,0,0.35);flex:none;display:grid;place-items:center;
  overflow:hidden;
}
.brand-logo-container svg{width:100%;height:100%}
.hero-text h1{margin:0;font-size:24px;font-weight:900;letter-spacing:-.015em;text-transform:uppercase}
.hero-text p{margin:2px 0 0;opacity:.85;font-size:12.5px;letter-spacing:.025em;font-weight:600}
.sir-tag{
  display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:800;
  background:rgba(245,158,11,0.22);color:#fbbf24;border:1px solid rgba(245,158,11,0.45);
  padding:3.5px 10px;border-radius:99px;margin-top:6px;
  letter-spacing:.025em;text-transform:uppercase;
}
.pwa-btn{
  background:linear-gradient(135deg, var(--gold), #d97706);
  border:none;box-shadow:0 6px 18px rgba(245,158,11,0.3);
  color:#fff;padding:9px 16px;border-radius:12px;font-size:12.5px;font-weight:800;
  display:inline-flex;align-items:center;gap:6px;cursor:pointer;
  transition:transform 0.15s;
}
.pwa-btn:active{transform:scale(0.96)}

/* Stats Box Group */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:-36px;position:relative;z-index:2}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:0 8px 24px -10px rgba(0,0,0,0.1)}
.stat small{color:var(--mute);font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.stat b{display:block;font-size:22px;margin-top:2px;font-weight:900}

/* Filter Controls bar */
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 12px;align-items:center}
.tabs{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px}
.tabs button{border:0;background:none;color:var(--mute);padding:8px 12px;border-radius:9px;font:inherit;font-weight:700;cursor:pointer;font-size:13px}
.tabs .on{background:var(--acc);color:var(--accfg)}
.in{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit;min-height:42px}
.search{flex:1;min-width:160px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 14px;border-radius:10px;font:inherit;font-weight:700;cursor:pointer;min-height:40px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.p{background:var(--acc);color:var(--accfg);border-color:transparent}
.btn.on{border-color:var(--acc);color:var(--acc);background:rgba(42,98,217,0.08)}
.step{display:flex;align-items:center;gap:6px;color:var(--mute);font-size:13px;font-weight:700}.step b{color:var(--ink);min-width:18px;text-align:center}
.step .btn{padding:4px 10px;min-height:34px}

/* List View */
.list{display:grid;gap:10px}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.roll{grid-column:1/4;font-size:11px;color:var(--mute);letter-spacing:.05em;font-weight:800}
.nm{grid-column:1/3}.st{grid-column:3;justify-self:end}.act{grid-column:1/4;display:flex;gap:8px;margin-top:4px}
.c i{display:block;font-style:normal;font-size:11px;color:var(--mute);font-weight:700}
.ph{display:block;font-size:12.5px;color:var(--mute);text-decoration:none;margin-top:2px}
.dn{color:var(--bad)}
.chip{display:inline-block;padding:4px 10px;border-radius:99px;font-size:11px;font-weight:800;letter-spacing:.03em;white-space:nowrap}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.warn{background:var(--warnbg);color:var(--warn)}.chip.bad{background:var(--badbg);color:var(--bad)}
.hd{display:none}

.foot{margin:16px 4px;color:var(--mute);font-size:12.5px;display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:space-between;align-items:center}
.fab{
  position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));
  box-shadow:0 8px 24px rgba(42,98,217,0.45);border-radius:99px;padding:13px 22px;z-index:20;font-size:14px;
}

dialog{border:0;border-radius:20px;padding:20px;width:min(92vw,430px);background:var(--card);color:var(--ink);box-shadow:0 24px 60px rgba(0,0,0,0.3)}
dialog::backdrop{background:rgba(8,16,33,0.65);backdrop-filter:blur(4px)}
dialog h2{margin:0 0 14px;font-size:19px;font-weight:800}
.f{display:grid;grid-template-columns:1fr 1fr;gap:10px}.f label{font-size:12px;color:var(--mute);display:block;font-weight:700;margin-bottom:4px}.f .w{grid-column:1/3}
.dact{display:flex;gap:8px;margin-top:16px;justify-content:flex-end;flex-wrap:wrap}

#toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(82px + env(safe-area-inset-bottom,0px));
  background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;display:none;z-index:30;
  max-width:92vw;font-size:13.5px;font-weight:700;box-shadow:0 12px 30px rgba(0,0,0,0.35);
}
#toast.show{display:flex;align-items:center;gap:10px}
#toast button{border:0;background:none;color:var(--acc);font:inherit;font-weight:800;cursor:pointer}

@media(min-width:700px){.stats{grid-template-columns:repeat(4,1fr)}}
@media(min-width:820px){
  .list{gap:0;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .row,.hd{display:grid;grid-template-columns:90px 1.6fr 140px 90px 100px 100px 160px;align-items:center;gap:12px}
  .row{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:12px 18px}.row:last-child{border-bottom:0}
  .roll,.nm,.st,.act{grid-column:auto;margin-top:0}.st{justify-self:start}.c i{display:none}
  .hd{padding:12px 18px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);border-bottom:1px solid var(--line);font-weight:800}
}
</style>
</head>

<script>
// PWA Installation Feature & SW
let deferredPrompt;
const pwaBtn = document.getElementById('pwaBtn');
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  pwaBtn.style.display = 'inline-flex';
});
pwaBtn.addEventListener('click', async () => {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    if (outcome === 'accepted') pwaBtn.style.display = 'none';
    deferredPrompt = null;
  }
});
if ('serviceWorker' in navigator) {
  const swCode = `self.addEventListener('fetch',e=>{e.respondWith(fetch(e.request).catch(()=>caches.match(e.request)))});`;
  const blob = new Blob([swCode], { type: 'text/javascript' });
  navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
}

const SEED=[[9,"RC9-01","Student_1","+91 XXXXX X0001",500,1500],[9,"RC9-02","Student_2","+91 XXXXX X0002",500,1000],[9,"RC9-03","Student_3","+91 XXXXX X0003",500,500],[9,"RC9-04","Student_4","+91 XXXXX X0004",500,0],[9,"RC9-05","Student_5","+91 XXXXX X0005",500,1500],[9,"RC9-06","Student_6","+91 XXXXX X0006",500,1000],[9,"RC9-07","Student_7","+91 XXXXX X0007",500,0],[9,"RC9-08","Student_8","+91 XXXXX X0008",500,1500],[9,"RC9-09","Student_9","+91 XXXXX X0009",500,500],[9,"RC9-10","Student_10","+91 XXXXX X0010",500,1500],[9,"RC9-11","Student_11","+91 XXXXX X0011",500,1000],[9,"RC9-12","Student_12","+91 XXXXX X0012",500,0],[9,"RC9-13","Student_13","+91 XXXXX X0013",500,1500],[9,"RC9-14","Student_14","+91 XXXXX X0014",500,500],[9,"RC9-15","Student_15","+91 XXXXX X0015",500,1500],[9,"RC9-16","Student_16","+91 XXXXX X0016",500,1000],[9,"RC9-17","Student_17","+91 XXXXX X0017",500,0],[9,"RC9-18","Student_18","+91 XXXXX X0018",500,1500],[9,"RC9-19","Student_19","+91 XXXXX X0019",500,1000],[9,"RC9-20","Student_20","+91 XXXXX X0020",500,500],[10,"RC10-01","Student_1","+91 XXXXX X0021",500,1500],[10,"RC10-02","Student_2","+91 XXXXX X0022",500,1500],[10,"RC10-03","Student_3","+91 XXXXX X0023",500,1000],[10,"RC10-04","Student_4","+91 XXXXX X0024",500,500],[10,"RC10-05","Student_5","+91 XXXXX X0025",500,0],[10,"RC10-06","Student_6","+91 XXXXX X0026",500,1500],[10,"RC10-07","Student_7","+91 XXXXX X0027",500,1000],[10,"RC10-08","Student_8","+91 XXXXX X0028",500,1500],[10,"RC10-09","Student_9","+91 XXXXX X0029",500,0],[10,"RC10-10","Student_10","+91 XXXXX X0030",500,500],[10,"RC10-11","Student_11","+91 XXXXX X0031",500,1500],[10,"RC10-12","Student_12","+91 XXXXX X0032",500,1000],[10,"RC10-13","Student_13","+91 XXXXX X0033",500,1500],[10,"RC10-14","Student_14","+91 XXXXX X0034",500,0],[10,"RC10-15","Student_15","+91 XXXXX X0035",500,1500],[10,"RC10-16","Student_16","+91 XXXXX X0036",500,1000],[10,"RC10-17","Student_17","+91 XXXXX X0037",500,500],[10,"RC10-18","Student_18","+91 XXXXX X0038",500,1500],[10,"RC10-19","Student_19","+91 XXXXX X0039",500,0],[10,"RC10-20","Student_20","+91 XXXXX X0040",500,1500]];
const KEY='rc-fee-tracker-v1',$=id=>document.getElementById(id);
const inr=n=>'\u20b9'+Math.round(n).toLocaleString('en-IN');
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const seed=()=>({months:3,students:SEED.map((r,i)=>({id:'s'+i,cls:r[0],roll:r[1],name:r[2],phone:r[3],fee:r[4],paid:r[5]}))});
let S,view='all',q='',duesOnly=false,editing=null;
try{const j=localStorage.getItem(KEY);S=j?JSON.parse(j):seed()}catch(e){S=seed()}
const due=s=>Math.max(0,s.fee*S.months-s.paid);
function status(s){const d=due(s);if(d===0)return['PAID','ok'];if(s.fee>0&&d<=s.fee)return['1 MONTH DUE','warn'];return[(s.fee>0?Math.floor(d/s.fee)+' MONTHS DUE':'DUE'),'bad']}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const ph=p=>{const d=String(p||'').replace(/[^\d+]/g,'');return /\d{10}/.test(d)&&!/x/i.test(p)?`<a class="ph" href="tel:${d}">${esc(p)}</a>`:`<span class="ph">${esc(p)}</span>`};
const rowH=s=>{const[t,c]=status(s),d=due(s);return `<div class="row" data-id="${s.id}"><div class="roll">${esc(s.roll)}</div><div class="c nm"><b>${esc(s.name)}</b>${ph(s.phone)}</div><div class="c st"><span class="chip ${c}">${t}</span></div><div class="c"><i>Fee / month</i>${inr(s.fee)}</div><div class="c"><i>Paid</i>${inr(s.paid)}</div><div class="c"><i>Due</i><b class="${d?'dn':''}">${inr(d)}</b></div><div class="act"><button class="btn p" data-a="pay">+ ${inr(s.fee)}</button><button class="btn" data-a="edit">Edit</button></div></div>`};
function render(){const A=S.students;
$('k1').textContent=A.length;$('k2').textContent=inr(A.reduce((a,s)=>a+s.paid,0));
$('k3').textContent=inr(A.reduce((a,s)=>a+due(s),0));$('k4').textContent=A.filter(s=>due(s)>0).length;
$('mv').textContent=S.months;
const L=A.filter(s=>(view==='all'||String(s.cls)===view)&&(!duesOnly||due(s)>0)&&(s.name+s.roll+s.phone).toLowerCase().includes(q));
$('list').innerHTML=L.length?L.map(rowH).join(''):'<div class="row" style="display:block;text-align:center;color:var(--mute)">No students match.</div>';
$('sum').textContent=`Showing ${L.length} students \u00b7 Collected ${inr(L.reduce((a,s)=>a+s.paid,0))} \u00b7 Due ${inr(L.reduce((a,s)=>a+due(s),0))}`;
}
let tt;function toast(m,u){const t=$('toast');t.innerHTML=esc(m)+(u?'<button id="undo">Undo</button>':'');t.classList.add('show');if(u)$('undo').onclick=()=>{u();t.classList.remove('show')};clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),5000)}
$('list').onclick=e=>{const b=e.target.closest('button');if(!b)return;const s=S.students.find(x=>x.id===b.closest('.row').dataset.id);if(!s)return;
if(b.dataset.a==='pay'){const p=s.paid,id=s.id;s.paid+=s.fee;save();render();toast(`Added ${inr(s.fee)} for ${s.name}`,()=>{const x=S.students.find(y=>y.id===id);if(x){x.paid=p;save();render()}})}else openEdit(s)};
function openEdit(s){editing=s?s.id:null;$('dt').textContent=s?'Edit student':'Add student';
$('fn').value=s?s.name:'';$('fp').value=s?s.phone:'';$('fc').value=s?s.cls:(view==='10'?'10':'9');$('fr').value=s?s.roll:'';$('ff').value=s?s.fee:500;$('fa').value=s?s.paid:0;
$('del').style.display=s?'':'none';$('dlg').showModal()}
$('add').onclick=()=>openEdit(null);$('cx').onclick=()=>$('dlg').close();
$('sv').onclick=()=>{const name=$('fn').value.trim();if(!name){$('fn').focus();return}
const cls=+$('fc').value;let s=editing?S.students.find(x=>x.id===editing):null;
if(!s){s={id:'s'+Date.now()};S.students.push(s)}
s.name=name;s.phone=$('fp').value.trim();s.cls=cls;s.fee=Math.max(0,+$('ff').value||0);s.paid=Math.max(0,+$('fa').value||0);
s.roll=$('fr').value.trim()||('RC'+cls+'-'+String(S.students.filter(x=>x.cls===cls).length).padStart(2,'0'));
save();render();$('dlg').close()};
$('del').onclick=()=>{if(confirm('Delete this student?')){S.students=S.students.filter(x=>x.id!==editing);save();render();$('dlg').close()}};
$('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;view=b.dataset.v;[...$('tabs').children].forEach(x=>x.classList.toggle('on',x===b));render()};
$('q').oninput=e=>{q=e.target.value.trim().toLowerCase();render()};
$('dues').onclick=e=>{duesOnly=!duesOnly;e.target.classList.toggle('on',duesOnly);render()};
$('mm').onclick=()=>{if(S.months>1){S.months--;save();render()}};$('mp').onclick=()=>{if(S.months<12){S.months++;save();render()}};

// Custom Safe CSV Export
$('csv').onclick=e=>{
  e.preventDefault();
  const rows=[['Class','Roll','Name','Contact','Fee','Paid','Due','Status']].concat(S.students.map(s=>[s.cls,s.roll,s.name,s.phone,s.fee,s.paid,due(s),status(s)[0]]));
  const csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `remedial-classes-fees-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('CSV exported successfully');
};
render();
</script>
