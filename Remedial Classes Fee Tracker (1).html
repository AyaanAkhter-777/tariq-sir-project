<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Remedial Classes Fee Tracker</title>
<style>
:root{--bg:#f3f5fa;--card:#fff;--ink:#16223b;--mute:#5d6a86;--line:#e2e7f1;--brand:#1b365d;--acc:#2a62d9;--accfg:#fff;--ok:#0f7a55;--okbg:#dff5ec;--warn:#8a5a00;--warnbg:#fdf0cf;--bad:#b42318;--badbg:#fde4e1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1424;--card:#171f33;--ink:#e8edf8;--mute:#9aa7c4;--line:#27314b;--brand:#0f2342;--acc:#6c9bff;--accfg:#0b1220;--ok:#5fd6a6;--okbg:#10362b;--warn:#f2c15a;--warnbg:#3a2d0e;--bad:#ff9a8f;--badbg:#401a17}}
:root[data-theme="dark"]{--bg:#0e1424;--card:#171f33;--ink:#e8edf8;--mute:#9aa7c4;--line:#27314b;--brand:#0f2342;--acc:#6c9bff;--accfg:#0b1220;--ok:#5fd6a6;--okbg:#10362b;--warn:#f2c15a;--warnbg:#3a2d0e;--bad:#ff9a8f;--badbg:#401a17}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:0 14px 96px}
.hero{background:linear-gradient(135deg,var(--brand),#2b5ea8);color:#fff;padding:22px 0 56px}
.hero h1{margin:0;font-size:22px;letter-spacing:.01em}.hero p{margin:4px 0 0;opacity:.85;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:-40px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat small{color:var(--mute);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.stat b{display:block;font-size:22px;margin-top:2px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 10px;align-items:center}
.tabs{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px}
.tabs button{border:0;background:none;color:var(--mute);padding:8px 12px;border-radius:9px;font:inherit;font-weight:600;cursor:pointer}
.tabs .on{background:var(--acc);color:var(--accfg)}
.in{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit;min-height:42px}
.search{flex:1;min-width:150px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 12px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer;min-height:40px}
.btn.p{background:var(--acc);color:var(--accfg);border-color:transparent}.btn.on{border-color:var(--acc);color:var(--acc)}
.step{display:flex;align-items:center;gap:6px;color:var(--mute);font-size:13px}.step b{color:var(--ink);min-width:18px;text-align:center}
.step .btn{padding:4px 10px;min-height:34px}
.list{display:grid;gap:10px}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.roll{grid-column:1/4;font-size:11px;color:var(--mute);letter-spacing:.05em}
.nm{grid-column:1/3}.st{grid-column:3;justify-self:end}.act{grid-column:1/4;display:flex;gap:8px}
.c i{display:block;font-style:normal;font-size:11px;color:var(--mute)}
.ph{display:block;font-size:12.5px;color:var(--mute);text-decoration:none}
.dn{color:var(--bad)}
.chip{display:inline-block;padding:4px 9px;border-radius:99px;font-size:11px;font-weight:700;letter-spacing:.03em;white-space:nowrap}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.warn{background:var(--warnbg);color:var(--warn)}.chip.bad{background:var(--badbg);color:var(--bad)}
.hd{display:none}
.foot{margin:12px 2px;color:var(--mute);font-size:12.5px;display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:space-between}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 6px 18px rgba(0,0,0,.25);border-radius:99px;padding:12px 18px;z-index:5}
dialog{border:0;border-radius:16px;padding:18px;width:min(92vw,420px);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(5,10,25,.55)}
dialog h2{margin:0 0 12px;font-size:18px}
.f{display:grid;grid-template-columns:1fr 1fr;gap:10px}.f label{font-size:12px;color:var(--mute);display:block}.f .w{grid-column:1/3}
.dact{display:flex;gap:8px;margin-top:14px;justify-content:flex-end;flex-wrap:wrap}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;display:none;z-index:9;max-width:92vw;font-size:14px}
#toast.show{display:block}#toast button{margin-left:8px;border:0;background:none;color:var(--acc);font:inherit;font-weight:700;cursor:pointer}
@media(min-width:700px){.stats{grid-template-columns:repeat(4,1fr)}}
@media(min-width:800px){
.list{gap:0;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row,.hd{display:grid;grid-template-columns:80px 1.6fr 140px 90px 100px 100px 150px;align-items:center;gap:10px}
.row{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:10px 16px}.row:last-child{border-bottom:0}
.roll,.nm,.st,.act{grid-column:auto}.st{justify-self:start}.c i{display:none}
.hd{padding:10px 16px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);border-bottom:1px solid var(--line)}
.roll{font-size:12.5px}
}
</style></head><body>
<div class="hero"><div class="wrap" style="padding-bottom:0">
<h1>Remedial Classes</h1><p>Aapka Vishwas Hamari Koshish &middot; Monthly fee and dues tracker</p></div></div>
<div class="wrap">
<div class="stats">
<div class="stat"><small>Total students</small><b id="k1">0</b></div>
<div class="stat"><small>Total collected</small><b id="k2">0</b></div>
<div class="stat"><small>Outstanding due</small><b id="k3" class="dn">0</b></div>
<div class="stat"><small>Students with dues</small><b id="k4">0</b></div></div>
<div class="bar">
<div class="tabs" id="tabs"><button data-v="all" class="on">All</button><button data-v="9">Class 9 &middot; 7 PM</button><button data-v="10">Class 10 &middot; 8 PM</button></div>
<input class="in search" id="q" type="search" placeholder="Search name, roll or phone">
<button class="btn" id="dues">Dues only</button>
<div class="step" title="Due = fee x months billed - paid">Months billed <button class="btn" id="mm">-</button><b id="mv">3</b><button class="btn" id="mp">+</button></div>
</div>
<div class="list"><div class="hd"><div>Roll</div><div>Student</div><div>Status</div><div>Fee</div><div>Paid</div><div>Due</div><div></div></div><div id="list" style="display:contents"></div></div>
<div class="foot"><span id="sum"></span><span><span id="sync"></span> &middot; <a href="#" id="csv" style="color:var(--acc)">Export CSV</a></span></div>
</div>
<button class="btn p fab" id="add">+ Add student</button>
<div id="toast"></div>
<dialog id="dlg"><h2 id="dt">Student</h2><div class="f">
<div class="w"><label>Name</label><input class="in" id="fn"></div>
<div class="w"><label>Parent contact</label><input class="in" id="fp" inputmode="tel"></div>
<div><label>Class</label><select class="in" id="fc"><option value="9">Class 9</option><option value="10">Class 10</option></select></div>
<div><label>Roll</label><input class="in" id="fr"></div>
<div><label>Fee per month</label><input class="in" id="ff" type="number" min="0" inputmode="numeric"></div>
<div><label>Total paid</label><input class="in" id="fa" type="number" min="0" inputmode="numeric"></div></div>
<div class="dact"><button class="btn" id="del" style="color:var(--bad)">Delete</button><button class="btn" id="cx">Cancel</button><button class="btn p" id="sv">Save</button></div></dialog>
<script>
const SEED=[[9,"RC9-01","Student_1","+91 XXXXX X0001",500,1500],[9,"RC9-02","Student_2","+91 XXXXX X0002",500,1000],[9,"RC9-03","Student_3","+91 XXXXX X0003",500,500],[9,"RC9-04","Student_4","+91 XXXXX X0004",500,0],[9,"RC9-05","Student_5","+91 XXXXX X0005",500,1500],[9,"RC9-06","Student_6","+91 XXXXX X0006",500,1000],[9,"RC9-07","Student_7","+91 XXXXX X0007",500,0],[9,"RC9-08","Student_8","+91 XXXXX X0008",500,1500],[9,"RC9-09","Student_9","+91 XXXXX X0009",500,500],[9,"RC9-10","Student_10","+91 XXXXX X0010",500,1500],[9,"RC9-11","Student_11","+91 XXXXX X0011",500,1000],[9,"RC9-12","Student_12","+91 XXXXX X0012",500,0],[9,"RC9-13","Student_13","+91 XXXXX X0013",500,1500],[9,"RC9-14","Student_14","+91 XXXXX X0014",500,500],[9,"RC9-15","Student_15","+91 XXXXX X0015",500,1500],[9,"RC9-16","Student_16","+91 XXXXX X0016",500,1000],[9,"RC9-17","Student_17","+91 XXXXX X0017",500,0],[9,"RC9-18","Student_18","+91 XXXXX X0018",500,1500],[9,"RC9-19","Student_19","+91 XXXXX X0019",500,1000],[9,"RC9-20","Student_20","+91 XXXXX X0020",500,500],[10,"RC10-01","Student_1","+91 XXXXX X0021",500,1500],[10,"RC10-02","Student_2","+91 XXXXX X0022",500,1500],[10,"RC10-03","Student_3","+91 XXXXX X0023",500,1000],[10,"RC10-04","Student_4","+91 XXXXX X0024",500,500],[10,"RC10-05","Student_5","+91 XXXXX X0025",500,0],[10,"RC10-06","Student_6","+91 XXXXX X0026",500,1500],[10,"RC10-07","Student_7","+91 XXXXX X0027",500,1000],[10,"RC10-08","Student_8","+91 XXXXX X0028",500,1500],[10,"RC10-09","Student_9","+91 XXXXX X0029",500,0],[10,"RC10-10","Student_10","+91 XXXXX X0030",500,500],[10,"RC10-11","Student_11","+91 XXXXX X0031",500,1500],[10,"RC10-12","Student_12","+91 XXXXX X0032",500,1000],[10,"RC10-13","Student_13","+91 XXXXX X0033",500,1500],[10,"RC10-14","Student_14","+91 XXXXX X0034",500,0],[10,"RC10-15","Student_15","+91 XXXXX X0035",500,1500],[10,"RC10-16","Student_16","+91 XXXXX X0036",500,1000],[10,"RC10-17","Student_17","+91 XXXXX X0037",500,500],[10,"RC10-18","Student_18","+91 XXXXX X0038",500,1500],[10,"RC10-19","Student_19","+91 XXXXX X0039",500,0],[10,"RC10-20","Student_20","+91 XXXXX X0040",500,1500]];
const KEY='rc-fee-tracker-v1',$=id=>document.getElementById(id);
const inr=n=>'\u20b9'+Math.round(n).toLocaleString('en-IN');
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const seed=()=>({months:3,students:SEED.map((r,i)=>({id:'s'+i,cls:r[0],roll:r[1],name:r[2],phone:r[3],fee:r[4],paid:r[5]}))});
let S,view='all',q='',duesOnly=false,editing=null,ref=null;
try{const j=localStorage.getItem(KEY);S=j?JSON.parse(j):seed()}catch(e){S=seed()}
const due=s=>Math.max(0,s.fee*S.months-s.paid);
function status(s){const d=due(s);if(d===0)return['PAID','ok'];if(s.fee>0&&d<=s.fee)return['1 MONTH DUE','warn'];return[(s.fee>0?Math.floor(d/s.fee)+' MONTHS DUE':'DUE'),'bad']}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(ref)ref.set(JSON.parse(JSON.stringify(S))).catch(()=>{})}
(async()=>{try{if(!window.claude)return;const db=await claude.use('db');if(!db)return;ref=db.doc('tracker/main');
ref.onSnapshot(s=>{if(s.exists){S=JSON.parse(JSON.stringify(s.data()));render()}$('sync').textContent='Synced'},()=>{})}catch(e){}})();
const ph=p=>{const d=String(p||'').replace(/[^\d+]/g,'');return /\d{10}/.test(d)&&!/x/i.test(p)?`<a class="ph" href="tel:${d}">${esc(p)}</a>`:`<span class="ph">${esc(p)}</span>`};
const rowH=s=>{const[t,c]=status(s),d=due(s);return `<div class="row" data-id="${s.id}"><div class="roll">${esc(s.roll)}</div><div class="c nm"><b>${esc(s.name)}</b>${ph(s.phone)}</div><div class="c st"><span class="chip ${c}">${t}</span></div><div class="c"><i>Fee / month</i>${inr(s.fee)}</div><div class="c"><i>Paid</i>${inr(s.paid)}</div><div class="c"><i>Due</i><b class="${d?'dn':''}">${inr(d)}</b></div><div class="act"><button class="btn p" data-a="pay">+ ${inr(s.fee)}</button><button class="btn" data-a="edit">Edit</button></div></div>`};
function render(){const A=S.students;
$('k1').textContent=A.length;$('k2').textContent=inr(A.reduce((a,s)=>a+s.paid,0));
$('k3').textContent=inr(A.reduce((a,s)=>a+due(s),0));$('k4').textContent=A.filter(s=>due(s)>0).length;
$('mv').textContent=S.months;
const L=A.filter(s=>(view==='all'||String(s.cls)===view)&&(!duesOnly||due(s)>0)&&(s.name+s.roll+s.phone).toLowerCase().includes(q));
$('list').innerHTML=L.length?L.map(rowH).join(''):'<div class="row" style="display:block;text-align:center;color:var(--mute)">No students match.</div>';
$('sum').textContent=`Showing ${L.length} students \u00b7 Collected ${inr(L.reduce((a,s)=>a+s.paid,0))} \u00b7 Due ${inr(L.reduce((a,s)=>a+due(s),0))}`;
if(!$('sync').textContent)$('sync').textContent='Saved on this device'}
let tt;function toast(m,u){const t=$('toast');t.innerHTML=esc(m)+(u?'<button id="undo">Undo</button>':'');t.classList.add('show');if(u)$('undo').onclick=()=>{u();t.classList.remove('show')};clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),5000)}
$('list').onclick=e=>{const b=e.target.closest('button');if(!b)return;const s=S.students.find(x=>x.id===b.closest('.row').dataset.id);if(!s)return;
if(b.dataset.a==='pay'){const p=s.paid,id=s.id;s.paid+=s.fee;save();render();toast(`Added ${inr(s.fee)} for ${s.name}`,()=>{const x=S.students.find(y=>y.id===id);if(x){x.paid=p;save();render()}})}else openEdit(s)};
function openEdit(s){editing=s?s.id:null;$('dt').textContent=s?'Edit student':'Add student';
$('fn').value=s?s.name:'';$('fp').value=s?s.phone:'';$('fc').value=s?s.cls:(view==='10'?'10':'9');$('fr').value=s?s.roll:'';$('ff').value=s?s.fee:500;$('fa').value=s?s.paid:0;
$('del').style.display=s?'':'none';$('dlg').showModal()}
$('add').onclick=()=>openEdit(null);$('cx').onclick=()=>$('dlg').close();
$('sv').onclick=()=>{const name=$('fn').value.trim();if(!name){$('fn').focus();return}
const cls=+$('fc').value;let s=editing?S.students.find(x=>x.id===editing):null;
if(!s){s={id:'s'+Date.now()};S.students.push(s)}
s.name=name;s.phone=$('fp').value.trim();s.cls=cls;s.fee=Math.max(0,+$('ff').value||0);s.paid=Math.max(0,+$('fa').value||0);
s.roll=$('fr').value.trim()||('RC'+cls+'-'+String(S.students.filter(x=>x.cls===cls).length).padStart(2,'0'));
save();render();$('dlg').close()};
$('del').onclick=()=>{if(confirm('Delete this student?')){S.students=S.students.filter(x=>x.id!==editing);save();render();$('dlg').close()}};
$('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;view=b.dataset.v;[...$('tabs').children].forEach(x=>x.classList.toggle('on',x===b));render()};
$('q').oninput=e=>{q=e.target.value.trim().toLowerCase();render()};
$('dues').onclick=e=>{duesOnly=!duesOnly;e.target.classList.toggle('on',duesOnly);render()};
$('mm').onclick=()=>{if(S.months>1){S.months--;save();render()}};$('mp').onclick=()=>{if(S.months<12){S.months++;save();render()}};
$('csv').onclick=async e=>{e.preventDefault();const rows=[['Class','Roll','Name','Contact','Fee','Paid','Due','Status']].concat(S.students.map(s=>[s.cls,s.roll,s.name,s.phone,s.fee,s.paid,due(s),status(s)[0]]));
const csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');
try{const d=window.claude&&await claude.use('downloads');if(!d){toast('Download is not available here');return}await d.save({filename:'remedial-fees.csv',data:csv})}catch(x){}};
render();
</script></body></html>
